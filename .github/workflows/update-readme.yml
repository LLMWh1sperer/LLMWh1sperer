name: Update AI Hindsight

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update AI Hindsight
        run: |
          DAY_OF_YEAR=$(date +%-j)
          TOTAL_HINDSIGHTS=$(wc -l < hindsight.txt)
          QUOTES_PER_CYCLE=6
          START_INDEX=$(( ((DAY_OF_YEAR - 1) * QUOTES_PER_CYCLE) % TOTAL_HINDSIGHTS + 1 ))
          TYPING_LINES=""

          for OFFSET in $(seq 0 $((QUOTES_PER_CYCLE - 1))); do
            HINDSIGHT_INDEX=$(( (START_INDEX + OFFSET - 1) % TOTAL_HINDSIGHTS + 1 ))
            HINDSIGHT=$(sed -n "${HINDSIGHT_INDEX}p" hindsight.txt)
            if [ -n "$TYPING_LINES" ]; then
              TYPING_LINES="${TYPING_LINES};"
            fi
            TYPING_LINES="${TYPING_LINES}\"${HINDSIGHT}\""
          done

          ENCODED_LINES=$(printf '%s' "$TYPING_LINES" | jq -sRr @uri | sed 's/%0A//g')

          cat > README.md << EOF
          #### AI Hindsight
          ![Typing SVG](https://readme-typing-svg.demolab.com?font=Cormorant+Garamond&size=20&duration=6000&pause=1800&color=0E8A16&vCenter=true&random=true&width=850&lines=${ENCODED_LINES})
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update AI Hindsight for $(date '+%B %d, %Y')" && git push)
