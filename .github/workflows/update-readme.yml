name: Update AI Hindsight Highlights

on:
  push:
    paths:
      - hindsight.txt
      - .github/workflows/update-readme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install image generator
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate animated highlights
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          width = 1200
          padding = 60
          font_size = 24
          line_gap = 10
          source = Path("hindsight.txt")
          output = Path(".github/assets/hindsight.gif")
          quotes = [line.strip() for line in source.read_text(encoding="utf-8").splitlines() if line.strip()]
          if not quotes:
              raise SystemExit("hindsight.txt contains no sentences")

          font_paths = (
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
              "/System/Library/Fonts/Supplemental/Arial.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
          )
          for font_path in font_paths:
              if Path(font_path).exists():
                  font = ImageFont.truetype(font_path, font_size)
                  break
          else:
              font = ImageFont.load_default()

          measuring_image = Image.new("RGB", (1, 1))
          measuring_draw = ImageDraw.Draw(measuring_image)

          def wrap(text):
              lines = []
              current = ""
              for word in text.split():
                  candidate = f"{current} {word}".strip()
                  box = measuring_draw.textbbox((0, 0), candidate, font=font)
                  if current and box[2] - box[0] > width - 2 * padding:
                      lines.append(current)
                      current = word
                  else:
                      current = candidate
              if current:
                  lines.append(current)
              return lines

          wrapped_quotes = [wrap(f"“{quote}”") for quote in quotes]
          line_height = font_size + line_gap
          height = max(120, max(len(lines) for lines in wrapped_quotes) * line_height + 50)
          frames = []

          for lines in wrapped_quotes:
              frame = Image.new("RGBA", (width, height), (0, 0, 0, 0))
              draw = ImageDraw.Draw(frame)
              first_y = (height - len(lines) * line_height) / 2 + line_height / 2
              for index, line in enumerate(lines):
                  draw.text(
                      (width / 2, first_y + index * line_height),
                      line,
                      font=font,
                      fill=(14, 138, 22, 255),
                      anchor="mm",
                  )

              alpha = frame.getchannel("A")
              palette_frame = frame.convert("RGB").quantize(colors=255)
              transparent = Image.eval(alpha, lambda value: 255 if value < 16 else 0)
              palette_frame.paste(255, mask=transparent)
              palette_frame.info["transparency"] = 255
              frames.append(palette_frame)

          output.parent.mkdir(parents=True, exist_ok=True)
          frames[0].save(
              output,
              save_all=True,
              append_images=frames[1:],
              duration=15000,
              loop=0,
              disposal=2,
              transparency=255,
              optimize=True,
          )
          PY

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/assets/hindsight.gif
          if ! git diff --staged --quiet; then
            git commit -m "Update AI Hindsight Highlights"
            git push
          fi
