name: Update Great Moments in AI Hindsight

on:
  push:
    paths:
      - hindsight.txt
      - .github/workflows/update-readme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Great Moments in AI Hindsight
        run: |
          TYPING_LINES=""

          while IFS= read -r HINDSIGHT; do
            if [ -z "$HINDSIGHT" ]; then
              continue
            fi
            if [ -n "$TYPING_LINES" ]; then
              TYPING_LINES="${TYPING_LINES};"
            fi
            TYPING_LINES="${TYPING_LINES}\"${HINDSIGHT}\""
          done < hindsight.txt

          ENCODED_LINES=$(printf '%s' "$TYPING_LINES" | jq -sRr @uri)

          cat > README.md << EOF
          #### Great Moments in AI Hindsight
          ![Animated quotes from Great Moments in AI Hindsight](https://readme-typing-svg.demolab.com?font=Cormorant+Garamond&size=20&duration=6000&pause=1800&color=0E8A16&vCenter=true&random=true&width=850&lines=${ENCODED_LINES})
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "Update Great Moments in AI Hindsight"
            git push
          fi
